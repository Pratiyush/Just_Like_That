<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <style>
    #card {
      --bg: #F7F9FC;        /* paper */
      --fg: #0B1F3A;        /* navy ink */
      --muted: #4E5E76;     /* secondary ink, 6.2:1 on --bg */
      --bar: #00B3A4;       /* muted teal: every bar but one */
      --accent: #FF6B6B;    /* coral: the highlighted bar */
      --grid: #DFE5EE;      /* hairline gridlines */
      --callout: #FFFFFF;   /* annotation card */
      background: var(--bg);
      color: var(--fg);
      font-family: 'IBM Plex Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      padding: 76px 80px 72px;
    }

    /* Masthead ------------------------------------------------------------ */
    .mast {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      padding-bottom: 22px;
      border-bottom: 3px solid var(--fg);
    }
    .kick { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .kick svg { flex: none; width: 34px; height: 30px; display: block; }
    .kick .k-bar { fill: var(--bar); }
    .kick .k-hl { fill: var(--accent); }
    .kick .k-base { fill: var(--fg); }
    .kicker {
      font-size: 26px; font-weight: 700; line-height: 1.2;
      letter-spacing: .14em; text-transform: uppercase;
    }
    .date {
      flex: none; white-space: nowrap;
      font-size: 26px; font-weight: 500; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Headline: the takeaway ---------------------------------------------- */
    .headline {
      flex: none;
      max-height: 520px;
      overflow: hidden;
      margin-top: 42px;
      padding-bottom: .1em;              /* room for descenders inside the clipped box */
      font-size: 88px; font-weight: 700; line-height: 1.04; letter-spacing: -0.028em;
      text-wrap: balance;
    }
    /* The highlighted phrase wears a coral marker: it is the legend for the coral bar. */
    .headline .hl {
      color: inherit;
      background: linear-gradient(to bottom,
        transparent 0 58%,
        color-mix(in srgb, var(--accent) 46%, transparent) 58% 90%,
        transparent 90%);
      padding: 0 .05em; margin: 0 -.05em;
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
    }

    .chart-title {
      flex: none;
      margin-top: 34px;
      font-size: 28px; font-weight: 500; line-height: 1.25; color: var(--muted);
    }

    /* Chart (drawn in Card.onRender) --------------------------------------- */
    .chart { position: relative; flex: 1 1 auto; min-height: 0; margin-top: 26px; }
    .chart svg { position: absolute; left: 0; top: 0; overflow: visible; }
    .chart .grid line { stroke: var(--grid); stroke-width: 2; }
    .chart .base { stroke: var(--fg); stroke-width: 3; }
    .chart .bar { fill: var(--bar); }
    .chart .bar.is-hl { fill: var(--accent); }
    .chart .lead { fill: none; stroke: var(--fg); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .chart .lead-dot { fill: var(--fg); stroke: var(--bg); stroke-width: 3; }

    .vlab {
      position: absolute; white-space: nowrap;
      padding: 2px 6px; background: var(--bg);   /* halo: gridlines break around the number */
      font-size: 30px; font-weight: 600; line-height: 1; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .vlab.is-hl { font-size: 62px; font-weight: 700; color: var(--fg); letter-spacing: -0.025em; }
    .vlab .unit { font-size: .64em; font-weight: 600; letter-spacing: 0; }
    .vlab .unit.pre { margin-right: .04em; }
    .vlab .unit.suf { margin-left: .03em; }

    .xlab {
      position: absolute; text-align: center;
      font-size: 28px; font-weight: 500; line-height: 1.15; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .xlab.is-hl { color: var(--fg); font-weight: 700; }

    .anno {
      position: absolute; left: 0; top: 0;
      background: var(--callout);
      border-radius: 14px;
      padding: 20px 26px 22px 32px;
      font-size: 34px; line-height: 1.22; font-weight: 500; color: var(--fg);
      box-shadow:
        inset 6px 0 0 var(--accent),
        0 0 0 1.5px rgba(11, 31, 58, .07),
        0 14px 30px -12px rgba(11, 31, 58, .22);
    }
    .anno .hl { font-weight: 700; color: inherit; }

    /* Footer -------------------------------------------------------------- */
    .foot {
      flex: none;
      margin-top: 30px; padding-top: 22px;
      border-top: 2px solid var(--grid);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 40px;
      font-size: 26px; line-height: 1.3;
    }
    .source { min-width: 0; color: var(--muted); font-weight: 500; }
    .handle { flex: none; white-space: nowrap; font-weight: 700; margin-left: auto; }
  </style>
</head>
<body>
  <div id="card">
    <header class="mast">
      <div class="kick" data-if="kicker">
        <svg viewBox="0 0 34 30" aria-hidden="true">
          <rect class="k-bar" x="2" y="17" width="7" height="10" rx="1.5"/>
          <rect class="k-bar" x="13" y="11" width="7" height="16" rx="1.5"/>
          <rect class="k-hl" x="24" y="2" width="7" height="25" rx="1.5"/>
          <rect class="k-base" x="0" y="27" width="34" height="3"/>
        </svg>
        <span class="kicker" data-field="kicker"></span>
      </div>
      <span class="date" data-field="date"></span>
    </header>

    <h1 class="headline" data-field="headline" data-highlight data-fit data-fit-max="88" data-fit-min="64"></h1>
    <div class="chart-title" data-field="chartTitle"></div>
    <div class="chart" role="img"></div>

    <footer class="foot">
      <span class="source" data-field="source"></span>
      <span class="handle" data-field="handle"></span>
    </footer>
  </div>

  <script type="application/json" id="card-data">
  {
    "kicker": "Adoption trend",
    "headline": "AI agents now write code for 7 in 10 dev teams",
    "highlight": "7 in 10",
    "chartTitle": "Dev teams using an AI coding agent every week",
    "chart": [
      { "label": "2021", "value": 3 },
      { "label": "2022", "value": 6 },
      { "label": "2023", "value": 9 },
      { "label": "2024", "value": 19 },
      { "label": "2025", "value": 38 },
      { "label": "2026", "value": 71 }
    ],
    "chartUnit": "%",
    "chartHighlight": 5,
    "annotation": "Up from **1 in 10** in 2023. Not using one yet? You're the outlier now.",
    "source": "Source: Nova Labs Dev Pulse, illustrative data",
    "date": "Nov 9, 2026",
    "handle": "@yourhandle"
  }
  </script>
  <script src="../../shared/card.js"></script>
  <script>
  (function () {
    'use strict';
    var SVGNS = 'http://www.w3.org/2000/svg';

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function toNum(v) {
      if (typeof v === 'number') return v;
      if (typeof v !== 'string') return NaN;
      var s = v.replace(/−/g, '-').replace(/[^0-9.\-eE]/g, '');
      return s ? parseFloat(s) : NaN;
    }
    function rowsOf(data) {
      var src = Array.isArray(data.chart) ? data.chart : [];
      return src.map(function (d) {
        if (d === null || typeof d !== 'object') return null;
        var v = toNum(d.value);
        if (!isFinite(v)) return null;
        return { label: d.label === undefined || d.label === null ? '' : String(d.label), value: v };
      }).filter(Boolean);
    }
    function decimalsOf(values) {
      var dec = 0;
      values.forEach(function (v) {
        var s = String(v);
        if (/e/i.test(s)) return;
        var i = s.indexOf('.');
        if (i >= 0) dec = Math.max(dec, s.length - i - 1);
      });
      return Math.min(dec, 2);
    }
    function niceStep(span, target) {
      if (!(span > 0)) return 1;
      var raw = span / target;
      var mag = Math.pow(10, Math.floor(Math.log10(raw)));
      var norm = raw / mag;
      var nice = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
      return nice * mag;
    }

    /* Value label formatter: grouping, shared decimals, compact K/M/B for big numbers,
       unit as prefix (currency) or suffix (%, ×, ms, pts...). */
    function makeFormatter(values, unitRaw) {
      var maxAbs = Math.max.apply(null, values.map(Math.abs));
      var div = 1, mult = '';
      if (maxAbs >= 1e9) { div = 1e9; mult = 'B'; }
      else if (maxAbs >= 1e6) { div = 1e6; mult = 'M'; }
      else if (maxAbs >= 1e5) { div = 1e3; mult = 'K'; }
      var opts;
      if (div > 1) {
        var m = maxAbs / div;
        var d = m < 10 ? 2 : m < 100 ? 1 : 0;
        opts = { minimumFractionDigits: 0, maximumFractionDigits: d };
      } else {
        var dec = decimalsOf(values);
        opts = { minimumFractionDigits: dec, maximumFractionDigits: dec };
      }
      var unit = unitRaw === undefined || unitRaw === null ? '' : String(unitRaw);
      var pre = /^[$€£¥₹₩]/.test(unit);
      var unitText = unit;
      if (!pre && unit && !/^\s/.test(unit) && /^[A-Za-z]{2,}/.test(unit)) unitText = ' ' + unit;
      return function (v, withUnit) {
        var neg = v < 0;
        var s = (Math.abs(v) / div).toLocaleString('en-US', opts) + mult;
        var u = unit && withUnit !== false
          ? '<span class="unit ' + (pre ? 'pre' : 'suf') + '">' + esc(unitText) + '</span>' : '';
        return (neg ? '−' : '') + (pre ? u + esc(s) : esc(s) + u);
      };
    }

    function div(cls, parent) {
      var e = document.createElement('div');
      e.className = cls;
      parent.appendChild(e);
      return e;
    }
    function svgEl(tag, attrs, parent) {
      var e = document.createElementNS(SVGNS, tag);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      if (parent) parent.appendChild(e);
      return e;
    }
    function rect(l, t, w, h) { return { l: l, t: t, r: l + w, b: t + h }; }
    function pad(r, p) { return { l: r.l - p, t: r.t - p, r: r.r + p, b: r.b + p }; }
    function hit(a, b) { return a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t; }
    function segHit(x1, y1, x2, y2, r) {
      var l = Math.min(x1, x2), rr = Math.max(x1, x2), t = Math.min(y1, y2), b = Math.max(y1, y2);
      return l <= r.r && rr >= r.l && t <= r.b && b >= r.t;
    }

    /* Leader from the annotation box to the highlighted bar.
       Returns { pts: [[x,y],...], len, elbow } or null when no clean route exists. */
    function routeLeader(box, tg) {
      var lab = tg.lab, bar = tg.bar, cx = tg.cx;
      var top = Math.min(lab.t, bar.t);
      var bc = (box.t + box.b) / 2;
      function inBox(y) { return y >= box.t + 22 && y <= box.b - 22; }
      var left = box.r <= Math.min(lab.l, bar.l) - 28;
      var right = box.l >= Math.max(lab.r, bar.r) + 28;
      if (left || right) {
        var ex = left ? box.r : box.l;
        var opts = [];
        // 1) straight at the value label's optical centre
        var lc = (lab.t + lab.b) / 2;
        if (inBox(lc)) opts.push({ y: lc, x: left ? lab.l - 16 : lab.r + 16 });
        // 2) straight at the side of the bar, as close to the box centre as possible
        if (bar.b - bar.t >= 48) {
          var by = Math.max(bar.t + 24, Math.min(bar.b - 24, bc));
          if (inBox(by)) opts.push({ y: by, x: left ? bar.l - 16 : bar.r + 16 });
        }
        for (var i = 0; i < opts.length; i++) {
          var o = opts[i], len = left ? o.x - ex : ex - o.x;
          if (len >= 28) return { pts: [[ex, o.y], [o.x, o.y]], len: len, elbow: false, ay: o.y };
        }
        // 3) elbow: out of the box side, then down onto the top of the label
        if (bc < top - 34 && Math.abs(cx - ex) >= 34) {
          return { pts: [[ex, bc], [cx, bc], [cx, top - 16]], len: Math.abs(cx - ex) + (top - 16 - bc), elbow: true, ay: bc };
        }
        return null;
      }
      // 4) box sits above the bar: drop straight down
      if (box.l <= cx - 36 && box.r >= cx + 36 && box.b <= top - 44) {
        return { pts: [[cx, box.b], [cx, top - 16]], len: top - 16 - box.b, elbow: false, ay: box.b };
      }
      return null;
    }

    function leaderPath(pts) {
      if (pts.length === 2) return 'M' + pts[0][0] + ' ' + pts[0][1] + ' L' + pts[1][0] + ' ' + pts[1][1];
      var a = pts[0], c = pts[1], e = pts[2];
      var r = Math.min(14, Math.abs(c[0] - a[0]) / 2, Math.abs(e[1] - c[1]) / 2);
      var sx = Math.sign(c[0] - a[0]), sy = Math.sign(e[1] - c[1]);
      return 'M' + a[0] + ' ' + a[1] +
        ' L' + (c[0] - sx * r) + ' ' + c[1] +
        ' Q' + c[0] + ' ' + c[1] + ' ' + c[0] + ' ' + (c[1] + sy * r) +
        ' L' + e[0] + ' ' + e[1];
    }

    function barPath(x, t, w, h, up) {
      var r = Math.min(7, w / 2, h);
      if (h <= 0) return '';
      if (up) {
        return 'M' + x + ' ' + (t + h) + ' V' + (t + r) +
          ' Q' + x + ' ' + t + ' ' + (x + r) + ' ' + t +
          ' H' + (x + w - r) + ' Q' + (x + w) + ' ' + t + ' ' + (x + w) + ' ' + (t + r) +
          ' V' + (t + h) + ' Z';
      }
      var b = t + h;
      return 'M' + x + ' ' + t + ' V' + (b - r) +
        ' Q' + x + ' ' + b + ' ' + (x + r) + ' ' + b +
        ' H' + (x + w - r) + ' Q' + (x + w) + ' ' + b + ' ' + (x + w) + ' ' + (b - r) +
        ' V' + t + ' Z';
    }

    function draw(el, list, data) {
      el.innerHTML = '';
      var W = el.clientWidth, H = el.clientHeight;
      var n = list.length;
      var hi = parseInt(data.chartHighlight, 10);
      if (isNaN(hi)) hi = n - 1;
      if (hi < 0) hi = n + hi;
      if (hi < 0 || hi >= n) hi = n - 1;

      var values = list.map(function (d) { return d.value; });
      var maxV = Math.max(0, Math.max.apply(null, values));
      var minV = Math.min(0, Math.min.apply(null, values));
      var hasNeg = minV < 0;
      var step = niceStep(maxV - minV, 4);
      var hiD = maxV > 0 ? Math.ceil(maxV / step - 1e-9) * step : 0;
      var loD = minV < 0 ? Math.floor(minV / step + 1e-9) * step : 0;
      if (hiD === loD) hiD = loD + step;

      var slot = W / n;
      var barW = Math.min(slot * 0.6, 132);
      var fmt = makeFormatter(values, data.chartUnit);

      el.setAttribute('aria-label', list.map(function (d) { return d.label + ': ' + d.value + (data.chartUnit || ''); }).join(', '));

      var svg = svgEl('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' }, el);
      var gGrid = svgEl('g', { 'class': 'grid' }, svg);
      var gBars = svgEl('g', {}, svg);
      var gBase = svgEl('g', {}, svg);
      var gLead = svgEl('g', {}, svg);

      /* x-axis labels: centred in their slot, ≤ 2 lines, ≥ 26 px */
      var xl = list.map(function (d, i) {
        var e = div('xlab' + (i === hi ? ' is-hl' : ''), el);
        e.innerHTML = Card.format(d.label);
        e.style.width = (slot - 10) + 'px';
        e.style.left = (slot * i + 5) + 'px';
        return e;
      });
      var xs = 28;
      function xlOk() {
        return xl.every(function (e) {
          return e.scrollWidth <= e.clientWidth + 1 && e.offsetHeight <= xs * 1.15 * 2 + 2;
        });
      }
      while (!xlOk() && xs > 26) { xs -= 1; xl.forEach(function (e) { e.style.fontSize = xs + 'px'; }); }
      if (!xlOk()) xl.forEach(function (e) { e.style.overflowWrap = 'anywhere'; });
      var xlH = Math.max.apply(null, xl.map(function (e) { return e.offsetHeight; }).concat([0]));
      var axisH = list.some(function (d) { return d.label; }) ? xlH + 18 : 8;

      /* value labels: uniform size for the quiet bars, big for the highlighted one */
      var vl = list.map(function (d, i) {
        var e = div('vlab' + (i === hi ? ' is-hl' : ''), el);
        e.innerHTML = fmt(d.value);
        return e;
      });
      var quiet = vl.filter(function (e, i) { return i !== hi; });
      var vs = 30;
      function vlOk() { return quiet.every(function (e) { return e.offsetWidth <= slot - 4; }); }
      while (!vlOk() && vs > 26) { vs -= 1; quiet.forEach(function (e) { e.style.fontSize = vs + 'px'; }); }
      if (!vlOk()) {
        // editorial convention: when space is tight the unit rides only on the highlighted value
        vl.forEach(function (e, i) { if (i !== hi) e.innerHTML = fmt(list[i].value, false); });
      }
      var quietH = Math.max.apply(null, quiet.map(function (e) { return e.offsetHeight; }).concat([30]));
      var hlEl = vl[hi];
      var HL_MAX = 62, HL_MIN = 34;

      /* annotation: measure a few widths once */
      var annoEl = null, sizes = [];
      if (data.annotation !== undefined && data.annotation !== null && String(data.annotation).trim() !== '') {
        annoEl = div('anno', el);
        annoEl.innerHTML = Card.format(data.annotation);
        [0.5, 0.56, 0.44, 0.62, 0.38, 0.7, 0.8].forEach(function (f) {
          var w = Math.round(Math.max(300, Math.min(W, W * f)));
          annoEl.style.width = w + 'px';
          sizes.push({ w: w, h: annoEl.offsetHeight });
        });
      }

      var GAP = 12;
      var plotBottom = H - axisH - (hasNeg ? quietH + GAP + 6 : 0);
      var baseTop = HL_MAX + GAP + 4;
      var geo, best = null;

      for (var k = 0; k < 18; k++) {
        var pt = baseTop + k * 26;
        if (plotBottom - pt < 140 && k > 0) break;
        geo = layout(pt);
        if (!annoEl) break;
        best = placeAnno(geo);
        if (best) break;
      }
      if (annoEl && !best) {
        // last resort: park the callout at the top-left, no leader
        best = { w: sizes[0].w, h: sizes[0].h, x: 0, y: 0, leader: null };
      }

      function layout(pt) {
        function y(v) { return pt + (hiD - v) / (hiD - loD) * (plotBottom - pt); }
        var zeroY = y(0);
        var g = { pt: pt, y: y, zeroY: zeroY, bars: [], labs: [], obstacles: [] };
        list.forEach(function (d, i) {
          var cx = slot * (i + 0.5);
          var v = d.value, top, bot;
          if (v >= 0) { top = y(v); bot = zeroY; if (v > 0 && bot - top < 4) top = bot - 4; }
          else { top = zeroY; bot = y(v); if (bot - top < 4) bot = top + 4; }
          g.bars.push({ cx: cx, x: cx - barW / 2, t: top, h: bot - top, up: v >= 0, zero: v === 0 });
        });
        // quiet labels
        list.forEach(function (d, i) {
          if (i === hi) return;
          var e = vl[i], b = g.bars[i];
          var w = e.offsetWidth, h = e.offsetHeight;
          var l = Math.max(-4, Math.min(W + 4 - w, b.cx - w / 2));
          var t = b.up ? b.t - GAP - h : b.t + b.h + GAP;
          g.labs[i] = { l: l, t: t, w: w, h: h };
        });
        // highlighted label: largest size that clears its neighbours
        var hb = g.bars[hi];
        var size = HL_MAX, hl;
        for (; size >= HL_MIN; size -= 2) {
          hlEl.style.fontSize = size + 'px';
          var w2 = hlEl.offsetWidth, h2 = hlEl.offsetHeight;
          var l2 = Math.max(-6, Math.min(W + 6 - w2, hb.cx - w2 / 2));
          var t2 = hb.up ? hb.t - GAP - h2 : hb.t + hb.h + GAP;
          hl = { l: l2, t: t2, w: w2, h: h2 };
          var r2 = pad(rect(l2, t2, w2, h2), 8);
          var clash = false;
          for (var j = 0; j < n; j++) {
            if (j === hi) continue;
            var bj = g.bars[j], lj = g.labs[j];
            if (hit(r2, rect(bj.x, bj.t, barW, bj.h))) clash = true;
            if (hit(r2, rect(lj.l, lj.t, lj.w, lj.h))) clash = true;
          }
          if (!clash) break;
        }
        g.labs[hi] = hl;
        list.forEach(function (d, i) {
          var b = g.bars[i], L = g.labs[i];
          if (i === hi) return;
          g.obstacles.push(pad(rect(b.x, b.t, barW, b.h), 14));
          g.obstacles.push(pad(rect(L.l, L.t, L.w, L.h), 12));
        });
        g.target = {
          cx: hb.cx,
          bar: rect(hb.x, hb.t, barW, hb.h),
          lab: rect(hl.l, hl.t, hl.w, hl.h)
        };
        return g;
      }

      function placeAnno(g) {
        var tg = g.target;
        var forbid = [pad(tg.bar, 18), pad(tg.lab, 18)];
        var lineObs = g.obstacles.map(function (o) { return pad(o, -6); });
        var found = null;
        sizes.forEach(function (s) {
          var xsList = [];
          for (var x = 0; x <= W - s.w; x += 8) xsList.push(x);
          xsList.push(W - s.w);
          for (var y = 0; y + s.h <= plotBottom - 20; y += 6) {
            for (var q = 0; q < xsList.length; q++) {
              var box = rect(xsList[q], y, s.w, s.h);
              var bad = false, o;
              for (o = 0; o < g.obstacles.length && !bad; o++) if (hit(box, g.obstacles[o])) bad = true;
              for (o = 0; o < forbid.length && !bad; o++) if (hit(box, forbid[o])) bad = true;
              if (bad) continue;
              var ld = routeLeader(box, tg);
              if (!ld) continue;
              for (var p = 0; p + 1 < ld.pts.length && !bad; p++) {
                for (o = 0; o < lineObs.length && !bad; o++) {
                  if (segHit(ld.pts[p][0], ld.pts[p][1], ld.pts[p + 1][0], ld.pts[p + 1][1], lineObs[o])) bad = true;
                }
              }
              if (bad) continue;
              var score = Math.abs(ld.len - 64) + (ld.elbow ? 36 : 0) + Math.abs(ld.ay - (box.t + box.b) / 2) * 0.25 + s.h * 0.12 + y * 0.03;
              if (!found || score < found.score) {
                found = { score: score, w: s.w, h: s.h, x: box.l, y: box.t, leader: ld };
              }
            }
          }
        });
        return found;
      }

      /* ---- paint ---- */
      var g = geo;
      for (var tv = loD; tv <= hiD + step * 1e-6; tv += step) {
        if (Math.abs(tv) < step * 1e-6) continue;
        var gy = Math.round(g.y(tv)) + 0.5;
        svgEl('line', { x1: 0, x2: W, y1: gy, y2: gy }, gGrid);
      }
      g.bars.forEach(function (b, i) {
        if (b.zero) return;
        svgEl('path', { 'class': 'bar' + (i === hi ? ' is-hl' : ''), d: barPath(b.x, b.t, barW, b.h, b.up) }, gBars);
      });
      svgEl('line', { 'class': 'base', x1: 0, x2: W, y1: g.zeroY, y2: g.zeroY }, gBase);

      vl.forEach(function (e, i) {
        var L = g.labs[i];
        e.style.left = L.l + 'px';
        e.style.top = L.t + 'px';
      });
      xl.forEach(function (e) { e.style.top = (H - axisH + 18) + 'px'; });

      if (annoEl && best) {
        annoEl.style.width = best.w + 'px';
        annoEl.style.left = best.x + 'px';
        annoEl.style.top = best.y + 'px';
        if (best.leader) {
          var pts = best.leader.pts, end = pts[pts.length - 1];
          svgEl('path', { 'class': 'lead', d: leaderPath(pts) }, gLead);
          svgEl('circle', { 'class': 'lead-dot', cx: end[0], cy: end[1], r: 7.5 }, gLead);
        }
      }
    }

    Card.onRender(async function (data, card) {
      var el = card.querySelector('.chart');
      var list = rowsOf(data);
      el.innerHTML = '';
      if (!list.length) { el.hidden = true; return; }
      el.hidden = false;
      try {
        await Promise.all([
          document.fonts.load('700 62px "IBM Plex Sans"'),
          document.fonts.load('600 30px "IBM Plex Sans"'),
          document.fonts.load('500 34px "IBM Plex Sans"')
        ]);
        await document.fonts.ready;
      } catch (e) { /* fall back to whatever is available */ }
      Card.fit();            // settle the headline first so the chart gets its real height
      draw(el, list, data);
    });
  })();
  </script>
</body>
</html>
