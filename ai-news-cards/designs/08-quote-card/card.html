<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>08 · Quote Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Instrument+Sans:wght@400..700&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <style>
    #card {
      --bg: #C8553D;                       /* terracotta field */
      --fg: #F6E8D6;                       /* cream ink */
      --shade: rgba(96, 24, 10, .30);      /* kiln shade: deepens the text zone to >= 4.5:1 against cream */
      --glow: rgba(255, 196, 160, .10);    /* light falling on the glyph corner */
      --glyph: #983723;                    /* second-ink brick for the oversized quote mark */
      --ink: #9C3A26;                      /* text inside the cream pill and monogram */
      --accent: #F3C08A;                   /* underline under the highlight, closing mark */
      --rule: rgba(246, 232, 214, .42);
      --echo: rgba(246, 232, 214, .26);    /* hairline echo of the mark ("transparent" to switch off) */

      background: var(--bg);
      color: var(--fg);
      font-family: 'Instrument Sans', 'Inter', 'DejaVu Sans', sans-serif;
      display: flex;
      flex-direction: column;
      padding: 84px 88px 76px;
    }

    /* ---------- surface: light falloff, pigment mottle, paper grain ---------- */
    .light, .mottle, .grain, .fleck { position: absolute; inset: 0; pointer-events: none; }
    .light {
      background:
        radial-gradient(62% 38% at 4% 2%, var(--glow), rgba(255, 196, 160, 0) 72%),
        radial-gradient(140% 82% at 0% 0%, rgba(96, 24, 10, 0) 18%, var(--shade) 50%);
    }
    .mottle {
      opacity: .35;
      mix-blend-mode: multiply;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1350'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.0075' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .62  0 0 0 0 .30  0 0 0 0 .20  0 0 0 -1.2 .9'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>") 0 0 / 100% 100% no-repeat;
    }
    #card.q-full .light {                  /* long quotes reach the top: pull the light back so text keeps 4.5:1 */
      background:
        radial-gradient(40% 22% at 2% 1%, var(--glow), rgba(255, 196, 160, 0) 72%),
        radial-gradient(140% 82% at 0% 0%, rgba(96, 24, 10, 0) 4%, var(--shade) 30%);
    }
    .grain {
      opacity: .85;
      mix-blend-mode: soft-light;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' seed='8' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") 0 0 / 320px 320px;
    }

    .fleck {                               /* sparse pigment flecks, like unbleached stock */
      opacity: .5;
      mix-blend-mode: multiply;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' seed='21' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .14  0 0 0 0 .07  16 0 0 0 -11.2'/></filter><rect width='100%' height='100%' filter='url(%23s)'/></svg>") 0 0 / 420px 420px;
    }

    /* ---------- the oversized quotation mark ---------- */
    .glyph {
      position: absolute;
      left: -104px;
      top: 0;
      font-family: 'Fraunces', 'DejaVu Serif', Georgia, serif;
      font-size: 1340px;
      line-height: 1;
      font-weight: 700;
      font-variation-settings: 'opsz' 144, 'SOFT' 0, 'WONK' 0;
      color: var(--glyph);
      pointer-events: none;
      user-select: none;
    }
    .glyph::after {                        /* hairline echo of the mark, slightly off-register */
      content: '\201C';
      position: absolute;
      left: 0; top: 0;
      color: transparent;
      -webkit-text-stroke: 2px var(--echo);
      transform: translate(20px, -20px);
    }

    /* ---------- header ---------- */
    .top {
      position: relative;
      display: flex;
      justify-content: flex-end;
      min-height: 58px;
    }
    .kicker {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 13px 26px 13px 22px;
      border-radius: 999px;
      background: var(--fg);
      color: var(--ink);
      font-weight: 650;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .kicker::before {                      /* the "recording" dot */
      content: '';
      display: inline-block;
      vertical-align: .12em;
      width: 14px; height: 14px;
      margin: 0 14px 0 5px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 5px rgba(156, 58, 38, .18);
    }

    /* ---------- quote (the hero) ---------- */
    .quote-box {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-top: 30px;
      font-size: 120px;
    }
    .quote {
      margin-top: auto;                    /* sits on the byline; long quotes grow upward */
      padding-bottom: .1em;                /* room for descenders + underline inside the fit box */
      font-family: 'Fraunces', 'DejaVu Serif', Georgia, serif;
      font-weight: 400;
      font-size: 1em;
      line-height: 1.08;
      letter-spacing: -0.018em;
      font-variation-settings: 'SOFT' 0, 'WONK' 0;
      text-wrap: pretty;
    }
    .quote.is-short { text-wrap: balance; }
    .quote::after {                        /* the closing mark answers the giant opening one */
      content: '\201D';
      color: var(--accent);
      margin-left: .02em;
    }
    .quote .hl {
      font-style: italic;
      font-weight: 400;
      font-variation-settings: 'SOFT' 0, 'WONK' 0;
      color: var(--fg);
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: .055em;
      text-underline-offset: .14em;
      text-decoration-skip-ink: auto;
    }

    /* ---------- byline ---------- */
    .byline {
      position: relative;
      display: flex;
      align-items: center;
      gap: 34px;
      margin-top: 56px;
    }
    .monogram {
      position: relative;
      flex: none;
      width: 120px; height: 120px;
      margin-left: 10px;
      border-radius: 50%;
      background: var(--fg);
      color: var(--ink);
      display: grid;
      place-items: center;
    }
    .monogram::after {                     /* hairline seal ring */
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1.5px solid var(--rule);
    }
    .initials {
      font-family: 'Fraunces', 'DejaVu Serif', Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: 50px;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variation-settings: 'opsz' 72, 'SOFT' 50, 'WONK' 0;
      transform: translateY(-2px);
    }
    .who { flex: 1; min-width: 0; }
    .author {
      overflow: hidden;
      white-space: nowrap;
      font-family: 'Fraunces', 'DejaVu Serif', Georgia, serif;
      font-weight: 600;
      font-size: 44px;
      line-height: 1.15;
      letter-spacing: -0.005em;
      font-variation-settings: 'opsz' 48, 'SOFT' 0, 'WONK' 0;
    }
    .role {
      margin-top: 6px;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      font-size: 29px;
      line-height: 1.25;
      font-weight: 450;
    }

    /* ---------- footer ---------- */
    .foot {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
      margin-top: 46px;
      padding-top: 26px;
      border-top: 1.5px solid var(--rule);
      font-size: 27px;
      line-height: 1.3;
      font-weight: 500;
    }
    .meta {
      min-width: 0;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    .meta .date { white-space: nowrap; }
    .meta .source:not([hidden]) + .date::before { content: '\00B7'; margin: 0 .55em; }
    .handle { flex: none; max-width: 52%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; letter-spacing: .01em; }
  </style>
</head>
<body>
  <div id="card">
    <div class="glyph" aria-hidden="true">&#8220;</div>
    <div class="light"></div>
    <div class="mottle"></div>
    <div class="fleck"></div>
    <div class="grain"></div>

    <header class="top">
      <span class="kicker" data-field="kicker"></span>
    </header>

    <div class="quote-box" data-fit data-fit-max="164" data-fit-min="64">
      <blockquote class="quote" data-field="quote" data-highlight></blockquote>
    </div>

    <div class="byline" data-if="author">
      <div class="monogram" aria-hidden="true"><span class="initials"></span></div>
      <div class="who">
        <div class="author" data-field="author" data-fit data-fit-min="34"></div>
        <div class="role" data-field="authorRole"></div>
      </div>
    </div>

    <footer class="foot">
      <div class="meta"><span class="source" data-field="source"></span><span class="date" data-field="date"></span></div>
      <span class="handle" data-field="handle"></span>
    </footer>
  </div>

  <script type="application/json" id="card-data">
  {
    "kicker": "On the record",
    "quote": "The real risk isn't an AI that lies to you. It's one that always agrees with you.",
    "highlight": "always agrees with you",
    "author": "Dr. Maren Achterberg",
    "authorRole": "Director of AI Policy, Northlight Institute",
    "source": "Keynote, Open Futures Forum",
    "date": "Nov 9, 2026",
    "handle": "@yourhandle"
  }
  </script>
  <script src="../../shared/card.js"></script>
  <script>
    // Typographer's quotes: straight ' and " become curly ones.
    function smarten(t) {
      return t
        .replace(/(^|[\s(\[{—–-])"/g, '$1“').replace(/"/g, '”')
        .replace(/(^|[\s(\[{—–-])'/g, '$1‘').replace(/'/g, '’');
    }

    Card.onRender(function (data, card) {
      // The giant glyph is the opening mark, so strip any quotation marks the copy brings along.
      var quoteEl = card.querySelector('.quote');
      var text = String(data.quote || data.headline || '')
        .replace(/^[\s"“”„'‘’«»]+/, '')
        .replace(/[\s"“”'‘’«»]+$/, '');
      text = smarten(text);
      if (text) {
        var hl = data.highlight;
        hl = Array.isArray(hl) ? hl.map(function (h) { return smarten(String(h)); }) : (hl ? smarten(String(hl)) : hl);
        quoteEl.hidden = false;
        quoteEl.innerHTML = Card.format(text, hl);
        quoteEl.classList.toggle('is-short', text.split(/\s+/).length <= 18);
      }

      // Initials monogram from the author's name (skips honorifics and suffixes).
      var skip = /^(dr|prof|professor|sir|dame|mr|mrs|ms|mx|rev|hon|lord|lady|jr|sr|phd|md|ii|iii|iv)\.?$/i;
      var name = String(data.author || '').replace(/\([^)]*\)/g, '').split(',')[0].trim();
      var parts = name.split(/\s+/).filter(function (p) { return p && !skip.test(p); });
      if (!parts.length) parts = name.split(/\s+/).filter(Boolean);
      var clean = function (p) { return Array.from(p.replace(/^[^\p{L}\p{N}]+/u, ''))[0] || ''; };
      var first = parts.length ? clean(parts[0]) : '';
      var last = parts.length > 1 ? clean(parts[parts.length - 1]) : '';
      card.querySelector('.initials').textContent = (first + last).toUpperCase();
    });

    // Refine the fit once card.js has sized the quote to the whole box:
    //  1. Prefer a size that keeps the quote clear of the giant mark (the mark may slide up a little).
    //     Only quotes that would drop below a comfortable size get the whole box, with the mark as a watermark.
    //  2. Widow control: never leave one short word alone on the last line.
    Card.ready.then(function () {
      var card = document.getElementById('card');
      var box = card.querySelector('.quote-box');
      var quote = card.querySelector('.quote');
      var glyph = card.querySelector('.glyph');
      if (!box || !quote || quote.hidden || !glyph) return;

      var MIN = parseFloat(box.getAttribute('data-fit-min')) || 64;
      var COMFORT = 84;                 // smallest size worth shrinking to just to keep clear of the mark
      var GAP = 30;                     // air between the mark's bowls and the first line's cap height
      var CAP = 0.24;                   // cap height starts ~0.24em below the line top (Fraunces, lh 1.08)
      var gs = getComputedStyle(glyph);
      var gfs = parseFloat(gs.fontSize);
      var gTop = parseFloat(gs.top);
      var BOWL = 0.355;                 // bowl bottoms of the mark, in em of the glyph
      var MAX_LIFT = gfs * 0.045;
      var cardTop = card.getBoundingClientRect().top;

      function fits() { return box.scrollHeight <= box.clientHeight + 1 && box.scrollWidth <= box.clientWidth + 1; }
      function setSize(px) { box.style.fontSize = px + 'px'; }
      function shrinkToFit(start, floor) {
        var s = start; setSize(s);
        while (!fits() && s > floor) { s = Math.max(floor, s - Math.max(0.5, s * 0.015)); setSize(s); }
        return fits() ? s : null;
      }
      function lines() {
        var r = document.createRange(); r.selectNodeContents(quote);
        var rows = [];
        Array.prototype.forEach.call(r.getClientRects(), function (q) {
          if (q.width < 2) return;
          var row = rows.filter(function (w) { return Math.abs(w.b - q.bottom) < q.height * 0.5; })[0];
          if (!row) rows.push(row = { b: q.bottom, l: q.left, r: q.right });
          row.l = Math.min(row.l, q.left); row.r = Math.max(row.r, q.right);
        });
        rows.sort(function (a, b) { return a.b - b.b; });
        return rows;
      }

      var full = parseFloat(box.style.fontSize) || parseFloat(getComputedStyle(box).fontSize);
      var boxTop = box.getBoundingClientRect().top - cardTop;
      var clearY = gTop - MAX_LIFT + gfs * BOWL + GAP;   // the quote's cap height may start here
      box.style.paddingTop = 'max(0px, calc(' + (clearY - boxTop) + 'px - ' + CAP + 'em))';
      var size = shrinkToFit(full, Math.min(COMFORT, full));
      var floor = COMFORT;
      if (size === null) {              // too long to stay clear: use the whole box, mark becomes a watermark
        box.style.paddingTop = '';
        size = full; setSize(size); floor = MIN;
        card.classList.add('q-full');
      }

      // Widow control.
      var rows = lines();
      if (rows.length > 1 && (rows[rows.length - 1].r - rows[rows.length - 1].l) < box.clientWidth * 0.3) {
        var s = size, ok = false;
        while (s > Math.max(floor, size * 0.86)) {
          s = Math.max(floor, s - Math.max(0.5, s * 0.015)); setSize(s);
          var rr = lines();
          if (fits() && (rr.length === 1 || (rr[rr.length - 1].r - rr[rr.length - 1].l) >= box.clientWidth * 0.3)) { ok = true; break; }
        }
        if (ok) size = s; else setSize(size);
      }

      // Slide the mark up (off the top edge) just enough to clear the first line.
      var inkTop = quote.getBoundingClientRect().top - cardTop + size * CAP;
      var lift = Math.min(Math.max(0, gTop + gfs * BOWL + GAP - inkTop), MAX_LIFT);
      if (lift > 0) glyph.style.top = (gTop - lift) + 'px';
    });
  </script>
</body>
</html>
