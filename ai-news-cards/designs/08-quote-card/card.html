<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>08 · Quote Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Instrument+Sans:wght@400..700&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <style>
    #card {
      --bg: #C8553D;                       /* terracotta field */
      --fg: #F6E8D6;                       /* cream ink */
      --shade: rgba(96, 24, 10, .30);      /* kiln shade: deepens the text zone to >= 4.5:1 */
      --glow: rgba(255, 196, 160, .10);    /* light falling on the glyph corner */
      --glyph: #983723;                    /* second-ink brick for the oversized quote mark */
      --ink: #9C3A26;                      /* initials inside the cream monogram / kicker text */
      --accent: #F3C08A;                   /* underline under the highlight */
      --rule: rgba(246, 232, 214, .42);

      background: var(--bg);
      color: var(--fg);
      font-family: 'Instrument Sans', 'Inter', 'DejaVu Sans', sans-serif;
      display: flex;
      flex-direction: column;
      padding: 84px 88px 76px;
    }

    /* ---------- surface ---------- */
    .light, .grain, .fibre { position: absolute; inset: 0; pointer-events: none; }
    .light {
      background:
        radial-gradient(62% 38% at 4% 2%, var(--glow), rgba(255, 196, 160, 0) 72%),
        radial-gradient(140% 82% at 0% 0%, rgba(96, 24, 10, 0) 18%, var(--shade) 50%);
    }
    .grain {
      opacity: .5;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' seed='8' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-size: 320px 320px;
    }
    .fibre {
      opacity: .35;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1350'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.0075' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .62  0 0 0 0 .30  0 0 0 0 .20  0 0 0 -1.2 .9'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    /* ---------- the oversized quotation mark ---------- */
    .glyph {
      position: absolute;
      left: -104px;
      top: 0;
      font-family: 'Fraunces', 'DejaVu Serif', Georgia, serif;
      font-size: 1300px;
      line-height: 1;
      font-weight: 700;
      font-variation-settings: 'opsz' 144, 'SOFT' 0, 'WONK' 0;
      color: var(--glyph);
      pointer-events: none;
      user-select: none;
    }

    /* ---------- header ---------- */
    .top {
      position: relative;
      display: flex;
      justify-content: flex-end;
      min-height: 58px;
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      max-width: 100%;
      padding: 13px 26px 13px 22px;
      border-radius: 999px;
      background: var(--fg);
      color: var(--ink);
      font-weight: 650;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .kicker::before {
      content: '';
      flex: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 5px rgba(156, 58, 38, .18);
    }

    /* ---------- quote (the hero) ---------- */
    .quote-box {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-top: 140px;
      font-size: 120px;
    }
    .quote {
      margin-top: auto;                    /* sits on the byline; long quotes grow upward */
      padding-bottom: .1em;                /* room for descenders + underline inside the fit box */
      font-family: 'Fraunces', 'DejaVu Serif', Georgia, serif;
      font-weight: 400;
      font-size: 1em;
      line-height: 1.08;
      letter-spacing: -0.018em;
      font-variation-settings: 'SOFT' 0, 'WONK' 0;
      text-wrap: pretty;
      hanging-punctuation: first;
    }
    .quote::after {                       /* the closing mark answers the giant opening one */
      content: '\201D';
      color: var(--accent);
      margin-left: .02em;
    }
    .quote .hl {
      font-style: italic;
      font-weight: 400;
      font-variation-settings: 'SOFT' 0, 'WONK' 0;
      color: var(--fg);
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: .055em;
      text-underline-offset: .14em;
      text-decoration-skip-ink: auto;
    }

    /* ---------- byline ---------- */
    .byline {
      position: relative;
      display: flex;
      align-items: center;
      gap: 34px;
      margin-top: 52px;
    }
    .monogram {
      position: relative;
      flex: none;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: var(--fg);
      color: var(--ink);
      display: grid;
      place-items: center;
      margin-left: 10px;
    }
    .monogram::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1.5px solid var(--rule);
    }
    .initials {
      font-family: 'Fraunces', 'DejaVu Serif', Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: 50px;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variation-settings: 'opsz' 72, 'SOFT' 50, 'WONK' 1;
      transform: translateY(-2px);
    }
    .who { min-width: 0; }
    .author {
      font-family: 'Fraunces', 'DejaVu Serif', Georgia, serif;
      font-weight: 600;
      font-size: 44px;
      line-height: 1.1;
      letter-spacing: -0.005em;
      font-variation-settings: 'opsz' 48, 'SOFT' 0, 'WONK' 0;
    }
    .role {
      margin-top: 8px;
      font-size: 29px;
      line-height: 1.25;
      font-weight: 450;
    }

    /* ---------- footer ---------- */
    .foot {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
      margin-top: 48px;
      padding-top: 26px;
      border-top: 1.5px solid var(--rule);
      font-size: 27px;
      line-height: 1.3;
      font-weight: 500;
    }
    .meta { min-width: 0; }
    .meta .date::before { content: '·'; margin: 0 .55em; }
    .meta .source[hidden] + .date::before { content: none; }
    .handle { flex: none; font-weight: 650; letter-spacing: .01em; }
  </style>
</head>
<body>
  <div id="card">
    <div class="glyph" aria-hidden="true">&#8220;</div>
    <div class="light"></div>
    <div class="fibre"></div>
    <div class="grain"></div>

    <header class="top">
      <span class="kicker" data-field="kicker"></span>
    </header>

    <div class="quote-box" data-fit data-fit-max="164" data-fit-min="64">
      <blockquote class="quote" data-field="quote" data-highlight></blockquote>
    </div>

    <div class="byline" data-if="author">
      <div class="monogram" aria-hidden="true"><span class="initials"></span></div>
      <div class="who">
        <div class="author" data-field="author"></div>
        <div class="role" data-field="authorRole"></div>
      </div>
    </div>

    <footer class="foot">
      <div class="meta"><span class="source" data-field="source"></span><span class="date" data-field="date"></span></div>
      <span class="handle" data-field="handle"></span>
    </footer>
  </div>

  <script type="application/json" id="card-data">
  {
    "kicker": "On the record",
    "quote": "The real risk isn't an AI that lies to you. It's one that always agrees with you.",
    "highlight": "always agrees with you",
    "author": "Dr. Maren Achterberg",
    "authorRole": "Director of AI Policy, Northlight Institute",
    "source": "Keynote, Open Futures Forum",
    "date": "Nov 9, 2026",
    "handle": "@yourhandle"
  }
  </script>
  <script src="../../shared/card.js"></script>
  <script>
    // Typographer's quotes: straight ' and " become curly ones.
    function smarten(t) {
      return t
        .replace(/(^|[\s(\[{\u2014\u2013-])"/g, '$1\u201C').replace(/"/g, '\u201D')
        .replace(/(^|[\s(\[{\u2014\u2013-])'/g, '$1\u2018').replace(/'/g, '\u2019');
    }

    Card.onRender(function (data, card) {
      // The giant glyph is the opening mark, so strip any quotation marks the copy brings along.
      var quoteEl = card.querySelector('.quote');
      var text = String(data.quote || data.headline || '')
        .replace(/^[\s"“”„'‘’«»]+/, '')
        .replace(/[\s"“”'‘’«»]+$/, '');
      text = smarten(text);
      if (text) {
        quoteEl.hidden = false;
        var hl = data.highlight;
        hl = Array.isArray(hl) ? hl.map(function (h) { return smarten(String(h)); }) : (hl ? smarten(String(hl)) : hl);
        quoteEl.innerHTML = Card.format(text, hl);
      }

      // Initials monogram from the author's name (skips honorifics and suffixes).
      var skip = /^(dr|prof|professor|sir|dame|mr|mrs|ms|mx|rev|hon|lord|lady|jr|sr|phd|md|ii|iii|iv)\.?$/i;
      var name = String(data.author || '').replace(/\([^)]*\)/g, '').split(',')[0].trim();
      var parts = name.split(/\s+/).filter(function (p) { return p && !skip.test(p); });
      if (!parts.length) parts = name.split(/\s+/).filter(Boolean);
      var first = parts.length ? Array.from(parts[0].replace(/^[^\p{L}\p{N}]+/u, ''))[0] || '' : '';
      var last = parts.length > 1 ? Array.from(parts[parts.length - 1].replace(/^[^\p{L}\p{N}]+/u, ''))[0] || '' : '';
      card.querySelector('.initials').textContent = (first + last).toUpperCase();
    });

    // After fitting: keep the giant mark clear of the quote by sliding it up and off the top edge.
    // Very long quotes may still overlap its lower half, which reads as a deliberate watermark.
    Card.ready.then(function () {
      var card = document.getElementById('card');
      var glyph = card.querySelector('.glyph');
      var quote = card.querySelector('.quote');
      if (!glyph || !quote || quote.hidden) return;
      var cardTop = card.getBoundingClientRect().top;
      var fs = parseFloat(getComputedStyle(quote).fontSize);
      var inkTop = quote.getBoundingClientRect().top - cardTop + fs * 0.24;   // cap height starts ~0.24em into the line
      var gfs = parseFloat(getComputedStyle(glyph).fontSize);
      var top0 = parseFloat(getComputedStyle(glyph).top);
      var inkBottom = top0 + gfs * 0.355;                                      // bowl bottoms of the mark
      var gap = 34;
      var lift = Math.min(Math.max(0, inkBottom + gap - inkTop), gfs * 0.15);
      if (lift > 0) glyph.style.top = (top0 - lift) + 'px';
    });
  </script>
</body>
</html>
