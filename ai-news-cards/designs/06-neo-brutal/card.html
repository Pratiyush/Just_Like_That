<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>06 Neo-Brutal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <style>
    #card {
      --bg: #FF90E8;          /* bubblegum */
      --ink: #000000;         /* borders, shadows, text */
      --paper: #FFFFFF;       /* window body */
      --yellow: #FFD60A;      /* sticker, highlight */
      --blue: #3D5AFE;        /* title bar, CTA */
      --on-blue: #FFFFFF;
      --bw: 6px;              /* border weight */
      --drop: 14px;           /* hard shadow offset */

      background-color: var(--bg);
      /* flat dot grid, no gradients */
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='20' cy='20' r='2.4' fill='%23000' fill-opacity='.16'/></svg>");
      background-position: 0 0;
      color: var(--ink);
      font-family: 'Space Grotesk', 'DejaVu Sans', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      padding: 72px 72px 72px;
    }

    /* ---------- decoration on the pink field ---------- */
    .deco { position: absolute; pointer-events: none; }
    .deco--flower { left: -92px; top: 640px; width: 220px; height: 220px; }
    .deco--marks  { left: 664px; top: 56px; width: 92px; height: 92px; z-index: 3; }

    /* ---------- kicker chip ---------- */
    .top { position: relative; z-index: 2; display: flex; align-items: center; height: 72px; padding-right: 330px; }
    .chip {
      display: inline-flex; align-items: center; gap: 14px;
      max-width: 100%;
      height: 68px; padding: 0 26px 0 18px;
      background: var(--paper);
      border: var(--bw) solid var(--ink);
      box-shadow: 7px 7px 0 var(--ink);
    }
    .chip svg { flex: none; width: 34px; height: 34px; }
    .chip-text {
      display: block; min-width: 0;
      white-space: nowrap; overflow: hidden;
      font-weight: 700; font-size: 30px; line-height: 1.2; letter-spacing: .1em; text-transform: uppercase;
    }

    /* ---------- the app window ---------- */
    .window {
      position: relative; z-index: 1;
      flex: 1; min-height: 0;
      margin-top: 44px; margin-right: var(--drop);
      display: flex; flex-direction: column;
      background: var(--paper);
      border: var(--bw) solid var(--ink);
      border-radius: 18px;
      box-shadow: var(--drop) var(--drop) 0 var(--ink);
      overflow: hidden;
    }
    .titlebar {
      flex: none; height: 86px;
      display: flex; align-items: center; gap: 26px;
      padding: 0 28px;
      background: var(--blue);
      border-bottom: var(--bw) solid var(--ink);
      color: var(--on-blue);
    }
    .lights { display: flex; gap: 12px; flex: none; }
    .lights i { display: block; width: 28px; height: 28px; border-radius: 50%; border: 4px solid var(--ink); }
    .lights i:nth-child(1) { background: var(--bg); }
    .lights i:nth-child(2) { background: var(--yellow); }
    .lights i:nth-child(3) { background: var(--paper); }
    .wtitle {
      min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-weight: 700; font-size: 30px; letter-spacing: .02em;
      padding-right: 200px;
    }

    .wbody {
      position: relative;
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 54px 60px 56px 56px;
    }
    .headline {
      flex: 1 1 auto; min-height: 0; overflow: hidden;
      font-family: 'Bricolage Grotesque', 'Archivo Black', 'DejaVu Sans', sans-serif;
      font-weight: 800; font-variation-settings: 'opsz' 96;
      font-size: 120px; line-height: 1.0; letter-spacing: -0.022em;
      padding-bottom: .12em; /* room for the highlight's hard shadow */
    }
    .headline .hl {
      background: var(--yellow);
      color: var(--ink);
      padding: 0 .12em;
      margin: 0 .02em;
      border: .05em solid var(--ink);
      box-shadow: .07em .07em 0 var(--ink);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    /* blinking-cursor detail: the window is a text editor */
    .headline::after {
      content: '';
      display: inline-block;
      width: .09em; height: .78em;
      margin-left: .08em;
      vertical-align: -0.04em;
      background: var(--blue);
    }

    .sub {
      flex: none; margin-top: 40px;
      display: flex; gap: 22px; align-items: flex-start;
      padding-top: 34px;
      border-top: var(--bw) solid var(--ink);
    }
    .subhead {
      max-height: 152px; overflow: hidden;
      font-weight: 500; font-size: 37px; line-height: 1.3; letter-spacing: -0.005em;
    }

    /* ---------- footer: hand-drawn arrow + CTA button ---------- */
    .bottom {
      position: relative; z-index: 2;
      flex: none; height: 148px; margin-top: 18px;
      display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px;
      padding-right: 10px; padding-bottom: 10px;
    }
    .arrow { flex: 1 1 240px; min-width: 140px; max-width: 300px; height: 136px; align-self: flex-start; }
    .cta {
      flex: 0 1 auto; min-width: 0; max-width: 760px;
      display: flex; align-items: center; gap: 18px;
      height: 104px; padding: 0 30px 0 36px;
      background: var(--blue); color: var(--on-blue);
      border: var(--bw) solid var(--ink);
      border-radius: 999px;
      box-shadow: 10px 10px 0 var(--ink);
    }
    .cta-text {
      min-width: 0; max-height: 92px; overflow: hidden;
      font-weight: 700; font-size: 36px; line-height: 1.12; letter-spacing: -0.005em;
      text-wrap: balance;
    }
    .cta-icon {
      flex: none; width: 58px; height: 58px; border-radius: 50%;
      background: var(--yellow); border: 4px solid var(--ink);
      display: grid; place-items: center;
    }
    .cta-icon svg { width: 30px; height: 30px; }

    /* ---------- the sticker ---------- */
    .sticker {
      position: absolute; z-index: 3;
      right: 74px; top: 64px;
      width: 268px; height: 268px;
      transform: rotate(12deg);
    }
    .sticker svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .sticker-text {
      position: absolute; left: 50%; top: 50%;
      width: 176px; height: 124px;
      transform: translate(-50%, -50%);
      display: block; overflow: hidden;
      text-align: center;
      font-family: 'Archivo Black', 'Bricolage Grotesque', 'DejaVu Sans', sans-serif;
      font-size: 48px; line-height: .98; letter-spacing: -0.01em; text-transform: uppercase;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div id="card">
    <!-- decoration (bleeds off the left edge, sits behind the window) -->
    <svg class="deco deco--flower" viewBox="0 0 220 220" aria-hidden="true">
      <g transform="translate(110 110)">
        <g fill="#FFD60A" stroke="#000" stroke-width="6" stroke-linejoin="round" id="petals"></g>
        <circle r="26" fill="#3D5AFE" stroke="#000" stroke-width="6"/>
      </g>
    </svg>
    <!-- hand-drawn emphasis marks next to the sticker -->
    <svg class="deco deco--marks" viewBox="0 0 92 92" aria-hidden="true">
      <g fill="none" stroke="#000" stroke-width="7" stroke-linecap="round">
        <path d="M70 52 L 38 44"/>
        <path d="M74 36 L 50 14"/>
        <path d="M86 28 L 80 4"/>
      </g>
    </svg>

    <header class="top" data-if="kicker">
      <div class="chip">
        <svg viewBox="0 0 34 34" aria-hidden="true">
          <path d="M17 2.5 C18.6 12 22 15.4 31.5 17 C22 18.6 18.6 22 17 31.5 C15.4 22 12 18.6 2.5 17 C12 15.4 15.4 12 17 2.5 Z" fill="#3D5AFE" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
        </svg>
        <span class="chip-text" data-field="kicker" data-fit data-fit-max="30" data-fit-min="26"></span>
      </div>
    </header>

    <section class="window">
      <div class="titlebar">
        <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="wtitle" data-field="handle"></span>
      </div>
      <div class="wbody">
        <h1 class="headline" data-field="headline" data-highlight data-fit data-fit-max="128" data-fit-min="64"></h1>
        <div class="sub" data-if="subhead">
          <p class="subhead" data-field="subhead" data-fit data-fit-max="37" data-fit-min="34"></p>
        </div>
      </div>
    </section>

    <footer class="bottom" data-if="cta">
      <!-- hand-drawn arrow: swoops out of the window and lands on the button -->
      <svg class="arrow" viewBox="0 0 260 136" preserveAspectRatio="xMaxYMid meet" aria-hidden="true">
        <g fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10 C 18 52, 34 96, 82 104 C 122 111, 140 78, 118 64 C 98 52, 82 84, 108 104 C 136 124, 188 118, 236 98"/>
          <path d="M214 80 L 239 97 L 212 116"/>
        </g>
      </svg>
      <div class="cta">
        <span class="cta-text" data-field="cta" data-fit data-fit-max="36" data-fit-min="28"></span>
        <span class="cta-icon" aria-hidden="true">
          <svg viewBox="0 0 30 30"><path d="M5 15 H24 M16 6.5 L24.5 15 L16 23.5" fill="none" stroke="#000" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
    </footer>

    <div class="sticker" data-if="sticker">
      <svg viewBox="-150 -150 300 300" aria-hidden="true">
        <path class="burst-shadow" fill="#000" transform="translate(10 10)"/>
        <path class="burst" fill="#FFD60A" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
      </svg>
      <span class="sticker-text" data-field="sticker" data-fit data-fit-max="48" data-fit-min="26"></span>
    </div>
  </div>

  <script type="application/json" id="card-data">
  {
    "kicker": "Opinion",
    "sticker": "Hot take",
    "headline": "Prompt engineering is dead. Taste is the new moat.",
    "highlight": "Taste",
    "subhead": "When every model can write decent code and copy, the edge goes to people who know what great looks like.",
    "cta": "Send this to your group chat",
    "handle": "@yourhandle"
  }
  </script>
  <script src="../../shared/card.js"></script>
  <script>
    Card.onRender(function (data, card) {
      // Starburst sticker: 16 spikes, slightly irregular so it feels cut by hand.
      var spikes = 16, R = 132, r = 108, d = '';
      for (var i = 0; i < spikes * 2; i++) {
        var a = (Math.PI * i) / spikes - Math.PI / 2;
        var rad = i % 2 ? r : R + (i % 4 === 0 ? 0 : -6);
        d += (i ? 'L' : 'M') + (Math.cos(a) * rad).toFixed(1) + ' ' + (Math.sin(a) * rad).toFixed(1);
      }
      d += 'Z';
      card.querySelectorAll('.burst, .burst-shadow').forEach(function (p) { p.setAttribute('d', d); });

      // Flower petals for the background doodle.
      var petals = card.querySelector('#petals');
      if (petals && !petals.childElementCount) {
        for (var k = 0; k < 8; k++) {
          var e = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
          e.setAttribute('cx', 0); e.setAttribute('cy', -62); e.setAttribute('rx', 30); e.setAttribute('ry', 44);
          e.setAttribute('transform', 'rotate(' + k * 45 + ')');
          petals.appendChild(e);
        }
      }
    });
  </script>
</body>
</html>
