<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>07 Myth vs Fact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Serif+Display:ital@0;1&family=Outfit:wght@500;600;700;800&display=block" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/base.css">
  <style>
    #card {
      --bg: #1E2330;          /* dark slate */
      --fg: #F3F4F7;
      --muted: #A3ABBC;
      --myth: #FF5A5F;        /* coral */
      --fact: #2EC4B6;        /* mint */
      --ink: #1E2330;         /* text on mint */
      --myth-text: #E3E6ED;
      --cut: 64px;            /* rise of the diagonal divider */
      --pad-x: 76px;

      display: flex;
      flex-direction: column;
      padding: 72px var(--pad-x) 0;
      color: var(--fg);
      background:
        radial-gradient(120% 70% at 18% 8%, rgba(255, 255, 255, .045), transparent 60%),
        var(--bg);
      font-family: 'DM Sans', 'Inter', system-ui, sans-serif;
    }

    /* Film grain over everything */
    #card::after {
      content: '';
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: .32;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* ---------- Header ---------- */
    .head { position: relative; z-index: 2; flex: none; }
    .kicker-row {
      display: flex; align-items: center; gap: 18px;
      min-height: 40px;
    }
    .kicker-row .mark { flex: none; width: 34px; height: 34px; }
    .kicker {
      flex: 0 1 auto;
      font-family: 'Outfit', 'Inter', sans-serif;
      font-weight: 700; font-size: 27px; line-height: 1.15;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--muted);
    }
    .kicker-rule { flex: 1 1 60px; min-width: 60px; height: 2px; background: rgba(255, 255, 255, .14); }

    .headline {
      margin-top: 22px;
      max-height: 430px; overflow: hidden;
      font-family: 'Outfit', 'Inter', sans-serif;
      padding-bottom: .12em;  /* room for descenders: Chrome counts them as overflow */
      font-weight: 700; font-size: 68px; line-height: 1.06; letter-spacing: -0.02em;
      color: var(--fg);
      text-wrap: balance;
    }
    .headline .hl { color: var(--fact); }

    /* ---------- Pills (label + icon) ---------- */
    .pill {
      display: flex; align-items: center; gap: 14px;
      width: fit-content;
      height: 58px; padding: 0 26px 0 10px;
      border-radius: 999px;
      font-family: 'Outfit', 'Inter', sans-serif;
      font-weight: 800; font-size: 28px; line-height: 1;
      letter-spacing: .2em; text-transform: uppercase;
    }
    .pill svg { width: 40px; height: 40px; flex: none; }
    .pill-myth { background: var(--myth); color: var(--ink); }
    .pill-fact { background: var(--ink); color: var(--fact); }

    /* Fit containers: data-fit scales the copy (em) inside; the group centres itself
       with auto margins, which fall back to top-aligned when space runs out. */
    .fit {
      flex: 1 1 0; height: 0; min-height: 0;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .group { margin: auto 0; padding-bottom: .1em; }

    /* ---------- Myth (top panel) ---------- */
    .zone-myth {
      position: relative; z-index: 2;
      flex: 1 1 auto; min-height: 0;   /* flex-grow is set from content in JS */
      display: flex; flex-direction: column;
      padding: 36px 0 40px;
    }
    .myth-hatch {
      position: absolute; z-index: -1;
      left: calc(-1 * var(--pad-x)); right: calc(-1 * var(--pad-x));
      top: 0; bottom: -90px;
      background: repeating-linear-gradient(135deg, rgba(255, 90, 95, .075) 0 2px, transparent 2px 18px);
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 55%);
              mask-image: linear-gradient(to bottom, transparent, #000 55%);
    }
    .myth-fit { font-size: 88px; }   /* nominal size; data-fit-max lets short myths grow */
    .myth-copy {
      display: block; position: relative;
      margin-top: 28px;
      padding-left: .46em;
      font-family: 'DM Serif Display', Georgia, serif;
      font-weight: 400; line-height: 1.1; letter-spacing: -0.005em;
      color: var(--myth-text);
      text-wrap: balance;
    }
    .myth-copy::before {
      content: '\201C';
      position: absolute; left: 0; top: 0;
      color: var(--myth);
    }
    .myth-copy .hl { font-style: italic; }
    svg.strikes {
      position: absolute; left: 0; top: 0;
      overflow: visible; pointer-events: none;
      z-index: 3;
    }

    /* ---------- Fact (bottom panel) ---------- */
    .zone-fact {
      position: relative; z-index: 1;
      flex: 1 1 auto; min-height: 0;
      display: flex; flex-direction: column;
      margin: 0 calc(-1 * var(--pad-x));
      padding: calc(var(--cut) + 44px) var(--pad-x) 72px;
      color: var(--ink);
    }
    .fact-bg {
      position: absolute; inset: 0; z-index: -1;
      /* diagonal cut with a small notch that points down at the FACT label */
      clip-path: polygon(0 64px, 70px 59.9px, 106px 88px, 142px 55.6px, 100% 0, 100% 100%, 0 100%);
      background:
        radial-gradient(circle, rgba(30, 35, 48, .07) 1.6px, transparent 2px) 0 0 / 24px 24px,
        linear-gradient(172deg, rgba(255, 255, 255, .12), transparent 45%),
        var(--fact);
      overflow: hidden;
    }
    .fact-echo {
      position: absolute; left: 0; right: 0; top: -22px; height: 100px;
      background: var(--fact);
      clip-path: polygon(0 64px, 70px 59.9px, 106px 88px, 142px 55.6px, 100% 0, 100% 5px, 142px 60.6px, 106px 93px, 70px 64.9px, 0 69px);
      opacity: .55;
    }
    .fact-fit { font-size: 46px; }
    .fact-copy {
      display: block;
      margin-top: 26px;
      font-family: 'DM Sans', 'Inter', sans-serif;
      font-weight: 500; line-height: 1.28; letter-spacing: -0.01em;
      color: var(--ink);
      text-wrap: pretty;
    }
    .fact-copy .hl {
      font-weight: 700;
      background: linear-gradient(transparent 56%, rgba(255, 255, 255, .42) 56%, rgba(255, 255, 255, .42) 94%, transparent 94%);
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
    }

    .foot {
      flex: none;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 40px;
      margin-top: 30px;
      padding-top: 22px;
      border-top: 2px solid rgba(30, 35, 48, .22);
      font-size: 27px; line-height: 1.25;
      color: var(--ink);
    }
    .foot .source { font-weight: 500; }
    .foot .handle {
      flex: none; margin-left: auto;
      font-family: 'Outfit', 'Inter', sans-serif; font-weight: 700; letter-spacing: .01em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="card">
    <header class="head">
      <div class="kicker-row">
        <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
          <defs><clipPath id="mk"><circle cx="17" cy="17" r="15"/></clipPath></defs>
          <g clip-path="url(#mk)">
            <rect width="34" height="34" fill="#2EC4B6"/>
            <path d="M0 0H34L0 34Z" fill="#FF5A5F"/>
          </g>
        </svg>
        <span class="kicker" data-field="kicker"></span>
        <span class="kicker-rule"></span>
      </div>
      <h1 class="headline" data-field="headline" data-highlight data-fit data-fit-max="68" data-fit-min="64"></h1>
    </header>

    <section class="zone-myth">
      <div class="myth-hatch"></div>
      <div class="fit myth-fit" data-fit data-fit-max="128" data-fit-min="42">
        <div class="group">
          <div class="pill pill-myth">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="20" r="20" fill="#1E2330"/>
              <path d="M13.5 13.5l13 13M26.5 13.5l-13 13" stroke="#FF5A5F" stroke-width="4.4" stroke-linecap="round"/>
            </svg>
            <span data-field="mythLabel" data-default="Myth"></span>
          </div>
          <span class="myth-copy" data-field="myth"></span>
        </div>
      </div>
      <svg class="strikes" aria-hidden="true"></svg>
    </section>

    <section class="zone-fact">
      <div class="fact-echo"></div>
      <div class="fact-bg"></div>
      <div class="fit fact-fit" data-fit data-fit-max="66" data-fit-min="34">
        <div class="group">
          <div class="pill pill-fact">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="20" r="20" fill="#2EC4B6"/>
              <path d="M12.5 20.5l5.2 5.2 10-11" fill="none" stroke="#1E2330" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-field="factLabel" data-default="Fact"></span>
          </div>
          <span class="fact-copy" data-field="fact"></span>
        </div>
      </div>
      <footer class="foot">
        <span class="source" data-field="source"></span>
        <span class="handle" data-field="handle"></span>
      </footer>
    </section>
  </div>

  <script type="application/json" id="card-data">
  {
    "kicker": "AI reality check",
    "headline": "The AI myth that\u2019s failing students",
    "highlight": "",
    "mythLabel": "Myth",
    "factLabel": "Fact",
    "myth": "AI detectors can prove a student cheated.",
    "fact": "No detector is reliable enough to count as proof. They also flag human writing, especially from non-native English speakers. Treat any score as **a hint, never as evidence.**",
    "source": "Source: independent studies of AI-text detectors",
    "handle": "@yourhandle"
  }
  </script>
  <script src="../../shared/card.js"></script>
  <script>
    (function () {
      var NS = 'http://www.w3.org/2000/svg';

      function hash(s) {
        var h = 2166136261;
        for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
        return h >>> 0;
      }
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function frame() {
        return new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
      }
      /* Measure each rendered line of the myth word by word (so spaces don't count),
         skipping anything clipped by the fit box. */
      function lineBoxes(el, clipEl) {
        var clip = clipEl.getBoundingClientRect();
        var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
        var range = document.createRange();
        var lines = [];
        while (walker.nextNode()) {
          var node = walker.currentNode, text = node.nodeValue, re = /\S+/g, m;
          while ((m = re.exec(text))) {
            range.setStart(node, m.index);
            range.setEnd(node, m.index + m[0].length);
            var rects = range.getClientRects();
            for (var k = 0; k < rects.length; k++) {
              var r = rects[k];
              if (r.width < 1 || r.top > clip.bottom - 4) continue;
              var cy = (r.top + r.bottom) / 2, line = null;
              for (var j = 0; j < lines.length; j++) {
                if (Math.abs(lines[j].cy - cy) < r.height * 0.5) { line = lines[j]; break; }
              }
              if (line) {
                line.l = Math.min(line.l, r.left); line.r = Math.max(line.r, r.right);
                line.t = Math.min(line.t, r.top); line.b = Math.max(line.b, r.bottom);
              } else {
                lines.push({ cy: cy, l: r.left, r: r.right, t: r.top, b: r.bottom });
              }
            }
          }
        }
        return lines.sort(function (a, b) { return a.cy - b.cy; });
      }

      function drawStrikes(card) {
        var zone = card.querySelector('.zone-myth');
        var fit = card.querySelector('.myth-fit');
        var copy = card.querySelector('.myth-copy');
        var svg = card.querySelector('svg.strikes');
        if (!zone || !copy || !svg) return;
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        if (copy.hidden || !copy.textContent.trim()) return;

        var scale = card.getBoundingClientRect().width / card.offsetWidth || 1;
        var z = zone.getBoundingClientRect();
        var fs = parseFloat(getComputedStyle(copy).fontSize);
        var W = zone.offsetWidth, H = zone.offsetHeight;
        svg.setAttribute('width', W);
        svg.setAttribute('height', H);
        svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

        var defs = document.createElementNS(NS, 'defs');
        defs.innerHTML =
          '<filter id="strike-rough" filterUnits="userSpaceOnUse" x="-200" y="-200" width="' + (W + 400) + '" height="' + (H + 400) + '">' +
            '<feTurbulence type="fractalNoise" baseFrequency="0.008 0.045" numOctaves="2" seed="7" result="t"/>' +
            '<feDisplacementMap in="SourceGraphic" in2="t" scale="' + (fs * 0.07).toFixed(1) + '" xChannelSelector="R" yChannelSelector="G"/>' +
          '</filter>';
        svg.appendChild(defs);
        var g = document.createElementNS(NS, 'g');
        g.setAttribute('filter', 'url(#strike-rough)');
        svg.appendChild(g);

        var rand = rng(hash(copy.textContent));
        var maxX = W + fs * 0.05;
        lineBoxes(copy, fit).forEach(function (ln, i) {
          var x0 = (ln.l - z.left) / scale - fs * (0.10 + rand() * 0.06);
          var x1 = Math.min(maxX, (ln.r - z.left) / scale + fs * (0.08 + rand() * 0.08));
          var h = (ln.b - ln.t) / scale;
          var yc = (ln.t - z.top) / scale + h * 0.56;
          var rise = fs * (0.07 + rand() * 0.07) * (i % 2 ? -0.45 : 1);
          var bow = fs * (rand() - 0.4) * 0.09;
          g.appendChild(brush(x0, x1, yc, rise, bow, fs * 0.14, rand));
        });
      }

      /* A marker stroke: wobbly centre line, pressure-varied width, tapered tail. */
      function brush(x0, x1, yc, rise, bow, W, rand) {
        var n = Math.max(3, Math.round((x1 - x0) / (W * 9)));
        var ctrl = [];
        for (var k = 0; k <= n; k++) {
          var t = k / n;
          var jitter = (k > 0 && k < n) ? (rand() - 0.5) * W * 0.32 : 0;
          ctrl.push([x0 + (x1 - x0) * t, yc + rise * (0.5 - t) + bow * Math.sin(Math.PI * t) + jitter]);
        }
        var pts = [];
        var S = 14;
        for (var i = 0; i < ctrl.length - 1; i++) {
          var p0 = ctrl[i - 1] || ctrl[i], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[i + 2] || p2;
          for (var s = 0; s < S; s++) {
            var u = s / S, u2 = u * u, u3 = u2 * u;
            pts.push([0, 1].map(function (c) {
              return 0.5 * ((2 * p1[c]) + (-p0[c] + p2[c]) * u + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * u2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * u3);
            }));
          }
        }
        pts.push(ctrl[ctrl.length - 1]);
        var N = pts.length, L = [], R = [], ph = rand() * 6.28;
        for (var j = 0; j < N; j++) {
          var t2 = j / (N - 1);
          var a = pts[Math.max(0, j - 1)], b = pts[Math.min(N - 1, j + 1)];
          var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
          var nx = -dy / len, ny = dx / len;
          var w = W * (0.86 + 0.14 * Math.sin(Math.PI * t2)) * (1 + 0.07 * Math.sin(t2 * 17 + ph));
          if (t2 < 0.04) w *= 0.8 + 0.2 * (t2 / 0.04);
          if (t2 > 0.8) w *= 1 - 0.62 * Math.pow((t2 - 0.8) / 0.2, 1.4);
          L.push([pts[j][0] + nx * w / 2, pts[j][1] + ny * w / 2]);
          R.push([pts[j][0] - nx * w / 2, pts[j][1] - ny * w / 2]);
        }
        var f = function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); };
        var rEnd = Math.hypot(L[N - 1][0] - R[N - 1][0], L[N - 1][1] - R[N - 1][1]) / 2;
        var rStart = Math.hypot(L[0][0] - R[0][0], L[0][1] - R[0][1]) / 2;
        var d = 'M' + f(L[0]);
        for (j = 1; j < N; j++) d += 'L' + f(L[j]);
        d += 'A' + rEnd.toFixed(1) + ' ' + rEnd.toFixed(1) + ' 0 0 1 ' + f(R[N - 1]);
        for (j = N - 2; j >= 0; j--) d += 'L' + f(R[j]);
        d += 'A' + rStart.toFixed(1) + ' ' + rStart.toFixed(1) + ' 0 0 1 ' + f(L[0]) + 'Z';
        var path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'var(--myth)');
        return path;
      }

      /* Share the free height between MYTH and FACT so both panels scale together:
         find the largest common scale k (of each panel's nominal size, within its
         data-fit range) at which both fit, then give each panel what it needs at k. */
      function balancePanels(card) {
        var panels = [['.zone-myth', '.myth-fit'], ['.zone-fact', '.fact-fit']].map(function (z) {
          var fit = card.querySelector(z[1]);
          return {
            zone: card.querySelector(z[0]), fit: fit, group: fit && fit.querySelector('.group'),
            nominal: fit && parseFloat(getComputedStyle(fit).fontSize),
            max: fit && parseFloat(fit.getAttribute('data-fit-max')),
            min: fit && parseFloat(fit.getAttribute('data-fit-min'))
          };
        });
        if (panels.some(function (p) { return !p.zone || !p.group; })) return;
        var avail = panels.reduce(function (a, p) { return a + p.fit.clientHeight; }, 0);
        var kMax = Math.min.apply(null, panels.map(function (p) { return p.max / p.nominal; }));
        var kMin = Math.min.apply(null, panels.map(function (p) { return p.min / p.nominal; }));
        var k = kMax, needs;
        for (var guard = 0; guard < 80; guard++) {
          needs = panels.map(function (p) {
            p.fit.style.fontSize = Math.min(p.max, Math.max(p.min, p.nominal * k)) + 'px';
            return p.group.offsetHeight;
          });
          if (needs[0] + needs[1] <= avail || k <= kMin) break;
          k *= 0.97;
        }
        panels.forEach(function (p, i) {
          p.fit.style.fontSize = '';
          p.zone.style.flexGrow = Math.max(1, needs[i]);
        });
      }

      Card.onRender(async function (data, card) {
        /* Default panel labels when the data leaves them out. */
        card.querySelectorAll('[data-default]').forEach(function (el) {
          if (!el.textContent.trim()) { el.textContent = el.getAttribute('data-default'); el.hidden = false; }
        });
        /* The design adds its own opening quote mark: strip quotes the copy may already carry. */
        var copy = card.querySelector('.myth-copy');
        if (copy && !copy.hidden) {
          var first = copy.firstChild, last = copy.lastChild;
          if (first && first.nodeType === 3) first.nodeValue = first.nodeValue.replace(/^\s*["“”‘']+/, '');
          if (last && last.nodeType === 3) last.nodeValue = last.nodeValue.replace(/["“”’']+\s*$/, '');
        }
        /* No source and no handle: drop the footer rule too. */
        var foot = card.querySelector('.foot');
        if (foot) foot.hidden = !Array.prototype.some.call(foot.children, function (c) { return !c.hidden; });

        void card.offsetHeight;
        try { await document.fonts.ready; } catch (e) { /* ignore */ }
        await frame();
        try { await document.fonts.ready; } catch (e) { /* ignore */ }

        balancePanels(card);

        /* Fit now so the hand-drawn strikes follow the final line breaks.
           card.js fits again afterwards and lands on the same sizes. */
        Card.fit();
        drawStrikes(card);
      });
    })();
  </script>
</body>
</html>
